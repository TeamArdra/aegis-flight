# Continuous integration: the deterministic gate every PR must pass.
#
# Check names (use these EXACT strings as required status checks in the main ruleset):
#   ci-python    pytest + ruff on Linux / Python 3.13
#   ci-frontend  node --test + tsc + vite build on Node 24
#
# This workflow runs untrusted PR code, so it holds no secrets and only a read token.
# Fork PRs from first-time contributors additionally need maintainer approval
# (repository Actions setting). See docs/CLAUDE_AUTOMATION.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale PR runs; never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-python:
    name: ci-python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip freeze > "$RUNNER_TEMP/pip-freeze.txt"

      - name: Ruff
        run: ruff check src tests scripts backend

      - name: Pytest
        # pyproject addopts already adds -q; another -q (-qq) would hide the "N passed" line.
        # -p no:cacheprovider: no .pytest_cache writes. -r s: list skip reasons.
        run: python -m pytest -p no:cacheprovider -r s

      - name: Record resolved dependency versions
        if: always()
        run: |
          {
            echo "### Resolved Python packages"
            echo '```'
            grep -iE '^(numpy|pandas|scipy|scikit-learn|joblib|pymavlink|pytest|ruff|fastapi|pydantic)==' "$RUNNER_TEMP/pip-freeze.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  ci-frontend:
    name: ci-frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The tests are .ts files run by `node --test`; they need built-in type stripping.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Issue #10: numbers no committed artifact supports must not come back (a merge once restored
  # them silently). The pattern is the issue's claims grep; the allowlist is the issue's list of
  # audit documents that discuss the withdrawn claims. One deliberate difference: `2,900` must
  # not be the tail of a longer number, so "52,900 decisions" (a real count in
  # docs/stage2_report_draft.md) does not match while "₹2,900" still does.
  claims-guard:
    name: claims-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No unsupported claims outside the audit documents
        run: |
          if git grep -nE '11\.4 ?%|42\.8 MB|(^|[^0-9,])2,900|82\.4 ?km|4\.8 h|mIDS|0\.08 ms|EKF failsafe blind|92/100|729\+' \
              -- '*.md' '*.tsx' '*.ts' '*.py' \
              ':!docs/STAGE2_*' \
              ':!docs/SUBMISSION_READINESS_AUDIT.md' \
              ':!docs/REDTEAM_AUDIT_STAGE2.md' \
              ':!docs/GPS_WORKSTREAM_PROGRESS.md'; then
            echo "::error::unsupported claim found outside the allowlisted audit documents (issue #10)"
            exit 1
          fi
          echo "claims-guard: no unsupported claims found"
