# Universal multi-vehicle flight-hardening profile (W1, W3, W4, W6).
# Overrides built-in defaults (load with --config-dir configs/universal_flight).
# Adapts heading-vs-course automatically via HEARTBEAT.type (rotorcraft vs fixed-wing),
# learns static GPS-vs-baro offset on the ground while disarmed, enables airborne
# semantic firewall detection, ConstDet attitude-vs-accel check, and GNSS clock-skew check.
features:
  # 48 (default 16). Evidence: SITL, link-level, benign mission only, PX4 v1.16.2 + Gazebo Sim 8.15.0, no
  # attack injected. Re-run: scripts/hardware/px4_benign_netem.py + px4_netem_on.sh (on #82, not on this base;
  # tlogs not committed; run from a non-clean install at aff925e). PX4 streams ~370 msg/s; netem 40+-20 ms
  # jitter reordered frames up to ~22 sequence numbers, so the window of 16 counted late frames as forward
  # gaps (234-238 > 30): 113 of 556 benign decisions alerted. With 48: 0 of 876. Cost: against the repo's
  # seq_scramble model the per-tick gap-rule hit rate falls from ~0.80 to ~0.67, and jumps that stay within
  # 48 behind the high-water mark are not flagged. Calibrated on that one condition only; disclose when quoting.
  reorder_window: 48
  learn_baro_offset: true
  baro_offset_alpha: 0.05
protocol:
  auto_rate_baseline: true
  max_msg_rate_hz: 2000.0
  startup_grace_s: 3.0
  gnss_never_acquired_policy: coverage
  semantic_firewall_enabled: true
  gnss_clock_skew_enabled: true
  gnss_clock_max_jump_s: 5.0
physics:
  yaw_course_enabled: true
  yaw_course_auto: true
  use_learned_baro_offset: true
  control_semantics_enabled: true
  control_accel_residual_ms2: 4.5
  optflow_gps_speed_diff_ms: 4.0
  xmsg_checks: true
  battery_rise_v: 1.05
anomaly:
  enabled: false
fusion:
  ml_require_corroboration: true
