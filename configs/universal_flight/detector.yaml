# Universal multi-vehicle flight-hardening profile (W1, W3, W4, W6).
# Overrides built-in defaults (load with --config-dir configs/universal_flight).
# Adapts heading-vs-course automatically via HEARTBEAT.type (rotorcraft vs fixed-wing),
# learns static GPS-vs-baro offset on the ground while disarmed, enables airborne
# semantic firewall detection, ConstDet attitude-vs-accel check, and GNSS clock-skew check.
features:
  # reorder_window 24 (default 16): CANDIDATE (D11); not validated until a fresh SITL rerun at 24.
  # Nothing was measured at 24. The only evidence, artifacts/sitl/px4_netem_reorder_window/ (SITL, link-level,
  # benign mission only, PX4 v1.16.2 + Gazebo Sim 8.15.0, no attack injected on PX4), was computed at 48 and is
  # superseded pending that rerun. There PX4 streams ~370 msg/s and netem 40+-20 ms jitter reordered frames up to
  # ~22 sequence numbers, so window 16 counted late frames as forward gaps (234-238 > 30): 195 and 112 alerts in
  # two ~560-decision runs; window 48: 0 and 0. Cost at 48 (SIM, seq_scramble, 20 seeds): decision recall 0.966 ->
  # 0.911; jumps that stay within the window behind the high-water mark are not flagged, at any window size.
  reorder_window: 24
  learn_baro_offset: true
  baro_offset_alpha: 0.05
  # |dv|/dt over at least 0.15 s: netem reorder/jitter delivered velocity samples ms apart (45-57 m/s2 ConstDet spikes).
  accel_min_dt_s: 0.15
protocol:
  auto_rate_baseline: true
  max_msg_rate_hz: 2000.0
  startup_grace_s: 3.0
  gnss_never_acquired_policy: coverage
  semantic_firewall_enabled: true
  gnss_clock_skew_enabled: true
  gnss_clock_max_jump_s: 5.0
physics:
  yaw_course_enabled: true
  yaw_course_auto: true
  use_learned_baro_offset: true
  control_semantics_enabled: true
  # 8.0 (Stage-1 default 4.5): ConstDet models acceleration as thrust tilt only and ignores aerodynamic drag.
  # ArduCopter SITL, 12 m/s wind + turbulence 4 + GPS noise 0.8 m, benign guided flight, REPLAY of the captured
  # downlink: armed-frame residual p50 4.42 / p99 6.15 / max 6.43 m/s2 (a steady offset, not noise), so 4.5
  # alerted continuously. Calibrated on that one SITL condition only; disclose when quoting.
  control_accel_residual_ms2: 8.0
  optflow_gps_speed_diff_ms: 4.0
  xmsg_checks: true
  # 20 deg (Stage-1 default 10): VFR_HUD heading and ATTITUDE yaw are separate messages; under turbulence
  # (SITL wind 12 m/s, turb 4, netem 40+-20 ms jitter) benign disagreement reached 11-15 deg, 10 alerts in 30 min.
  # Costs sensitivity to forged heading offsets below 20 deg. Calibrated on that one SITL condition only.
  heading_yaw_tolerance_deg: 20.0
  battery_rise_v: 1.05
anomaly:
  enabled: false
fusion:
  ml_require_corroboration: true
