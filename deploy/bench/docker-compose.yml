# CPU/RAM-constrained zero-hardware software bench for AegisFlight (SIM only).
# Runs the field drill and the hw_readiness_soak inside a container capped at 2 vCPU / 512 MiB RAM.
#
# What this does NOT do (read before quoting results):
#   - The drill and the soak use in-memory virtual transports. They open no socket, so the `tc netem` qdisc that
#     apply_netem.sh puts on eth0 does not impair them. It only matters for a process that talks over eth0.
#   - The default command never connects to the SITL service and never starts the dashboard, even with the `sitl`
#     profile: that profile only starts the ArduCopter SITL container on the same bridge network.
#
# Secrets are required, there are no defaults (export them first):
#   export AEGIS_API_TOKEN=... AEGIS_ANCHOR_KEY=...
#
# Run (resource-capped drill + soak):
#   docker compose -f deploy/bench/docker-compose.yml run --rm aegis-companion
# Same, plus the ArduCopter SITL container on the bench network (not wired to the companion command):
#   docker compose -f deploy/bench/docker-compose.yml --profile sitl up --build
services:
  sitl-vehicle:
    profiles: ["sitl"]
    # third-party image, pinned by digest (the registry's `latest` manifest on 2026-11-21); not pulled or run by this change
    image: radarku/ardupilot-sitl@sha256:2364ae14e190e4cdd5d0839b3a55e6b5c6a980d9ff0000b1be7b8baae6fd50f1
    environment:
      - VEHICLE=ArduCopter
      - LAT=47.397742
      - LON=8.545594
      - ALT=488
      - DIR=0
      - SIM_SPEEDUP=1
    networks:
      bench_rf:
        ipv4_address: 172.30.0.10

  aegis-companion:
    build:
      context: ../..
      dockerfile: deploy/bench/Dockerfile.aegis
    cpus: "2.0"
    mem_limit: "512m"
    memswap_limit: "512m"
    cap_add:
      - NET_ADMIN
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - AEGIS_API_TOKEN=${AEGIS_API_TOKEN:?set AEGIS_API_TOKEN (no default secret is committed)}
      - AEGIS_ANCHOR_KEY=${AEGIS_ANCHOR_KEY:?set AEGIS_ANCHOR_KEY (no default secret is committed)}
      - AEGIS_CONFIG_DIR=/app/configs/universal_flight
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        # fails the run if netem cannot be applied (needs NET_ADMIN); it does not impair the in-memory drill/soak below
        /app/deploy/bench/apply_netem.sh eth0
        python -m aegisflight.cli.main field-drill
        python scripts/hardware/hw_readiness_soak.py --cycles 5 --flood-frames 3000
    networks:
      bench_rf:
        ipv4_address: 172.30.0.20

networks:
  bench_rf:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
